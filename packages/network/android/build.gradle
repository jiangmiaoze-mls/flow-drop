plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.flowdrop'
version = '1.0.0'

android {
  namespace 'com.flowdrop.network'

  defaultConfig {
    versionName = '1.0.0'
  }

  sourceSets {
    test {
      resources.srcDir('../../../apps/windows-agent/test/fixtures')
    }
  }
}

dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
